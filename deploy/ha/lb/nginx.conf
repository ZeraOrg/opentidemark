# nginx in front of three OpenTidemark nodes (SPEC §17.5). Include from nginx.conf's `http {}` for
# the HTTP servers; the gRPC server needs nginx 1.13.10+. Open-source nginx only checks backends
# passively (max_fails); for active /readyz checks use HAProxy, Caddy or nginx Plus.
# Set TIDEMARK_TRUSTED_PROXIES on the nodes to this host's address.

upstream tidemark_ui        { server tm-node1:8080 max_fails=2 fail_timeout=10s; server tm-node2:8080 max_fails=2 fail_timeout=10s; server tm-node3:8080 max_fails=2 fail_timeout=10s; keepalive 32; }
upstream tidemark_seq       { server tm-node1:5341 max_fails=2 fail_timeout=10s; server tm-node2:5341 max_fails=2 fail_timeout=10s; server tm-node3:5341 max_fails=2 fail_timeout=10s; keepalive 32; }
upstream tidemark_elastic   { server tm-node1:9200 max_fails=2 fail_timeout=10s; server tm-node2:9200 max_fails=2 fail_timeout=10s; server tm-node3:9200 max_fails=2 fail_timeout=10s; keepalive 32; }
upstream tidemark_otlp_http { server tm-node1:4318 max_fails=2 fail_timeout=10s; server tm-node2:4318 max_fails=2 fail_timeout=10s; server tm-node3:4318 max_fails=2 fail_timeout=10s; keepalive 32; }
upstream tidemark_otlp_grpc { server tm-node1:4317 max_fails=2 fail_timeout=10s; server tm-node2:4317 max_fails=2 fail_timeout=10s; server tm-node3:4317 max_fails=2 fail_timeout=10s; keepalive 32; }

# UI + API with TLS termination. Replace the certificate paths and server name.
server {
    listen 443 ssl;
    http2 on;
    server_name tidemark.example.internal;
    ssl_certificate     /etc/nginx/certs/tidemark.crt;
    ssl_certificate_key /etc/nginx/certs/tidemark.key;
    client_max_body_size 1100m;      # import uploads are up to 1 GiB per file (SPEC §9.9)

    location / {
        proxy_pass http://tidemark_ui;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_next_upstream error timeout http_503;
        # Live tail is Server-Sent Events: no buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

# Ingestion: one server per protocol port. The request body limits are enforced by OpenTidemark.
server {
    listen 5341;
    client_max_body_size 0;
    location / {
        proxy_pass http://tidemark_seq;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_503;
    }
}

server {
    listen 9200;
    client_max_body_size 0;
    location / {
        proxy_pass http://tidemark_elastic;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_503;
    }
}

server {
    listen 4318;
    client_max_body_size 0;
    location / {
        proxy_pass http://tidemark_otlp_http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_503;
    }
}

server {
    listen 4317;
    http2 on;
    client_max_body_size 0;
    location / {
        grpc_pass grpc://tidemark_otlp_grpc;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_next_upstream error timeout unavailable;
    }
}
