# SPDX-License-Identifier: Apache-2.0
# HAProxy (2.4+) in front of three OpenTidemark nodes (SPEC §17.5). No sticky sessions are needed.
# Every backend is health-checked on the node's /readyz (port 8080), which returns 503 as soon
# as a node starts draining, so it leaves rotation before it stops (TIDEMARK_DRAIN_SECONDS).
# Set TIDEMARK_TRUSTED_PROXIES on the nodes to this host's address.
global
    log stdout format raw local0
    maxconn 20000

defaults
    log global
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # Live tail (SSE) keeps responses open; heartbeats arrive every 15 s.
    timeout tunnel  1h

# UI + API with TLS termination. Replace the certificate path.
frontend ui
    mode http
    option httplog
    bind :443 ssl crt /etc/haproxy/certs/tidemark.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    option forwardfor
    default_backend tidemark_ui

backend tidemark_ui
    mode http
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    default-server check inter 2s fall 2 rise 2
    server tm-node1 tm-node1:8080
    server tm-node2 tm-node2:8080
    server tm-node3 tm-node3:8080

# Ingestion ports (Seq 5341, Elasticsearch 9200, OTLP/HTTP 4318). Add `ssl crt …` to the binds
# to terminate TLS here as well.
frontend seq
    mode http
    bind :5341
    option forwardfor
    default_backend tidemark_seq

backend tidemark_seq
    mode http
    balance roundrobin
    option httpchk GET /readyz
    default-server check port 8080 inter 2s fall 2 rise 2
    server tm-node1 tm-node1:5341
    server tm-node2 tm-node2:5341
    server tm-node3 tm-node3:5341

frontend elastic
    mode http
    bind :9200
    option forwardfor
    default_backend tidemark_elastic

backend tidemark_elastic
    mode http
    balance roundrobin
    option httpchk GET /readyz
    default-server check port 8080 inter 2s fall 2 rise 2
    server tm-node1 tm-node1:9200
    server tm-node2 tm-node2:9200
    server tm-node3 tm-node3:9200

frontend otlp_http
    mode http
    bind :4318
    option forwardfor
    default_backend tidemark_otlp_http

backend tidemark_otlp_http
    mode http
    balance roundrobin
    option httpchk GET /readyz
    default-server check port 8080 inter 2s fall 2 rise 2
    server tm-node1 tm-node1:4318
    server tm-node2 tm-node2:4318
    server tm-node3 tm-node3:4318

# OTLP/gRPC: HTTP/2 cleartext to the nodes; requests (not connections) are balanced.
frontend otlp_grpc
    mode http
    bind :4317 proto h2
    option forwardfor
    default_backend tidemark_otlp_grpc

backend tidemark_otlp_grpc
    mode http
    balance roundrobin
    option httpchk GET /readyz
    default-server check port 8080 check-proto h1 inter 2s fall 2 rise 2
    server tm-node1 tm-node1:4317 proto h2
    server tm-node2 tm-node2:4317 proto h2
    server tm-node3 tm-node3:4317 proto h2
