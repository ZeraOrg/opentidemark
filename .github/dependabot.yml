# SPDX-License-Identifier: Apache-2.0
# Dependency update PRs (SPEC §15.9, §17.4): once a week (Monday), all ecosystems together in ONE
# pull request (multi-ecosystem group), so a week costs a single CI run. Security updates are
# still raised immediately by Dependabot alerts.
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
updates:
  - package-ecosystem: gomod
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: npm
    directory: /web
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
