# Dependency update PRs (SPEC §15.9, §17.4): once a week (Monday), all ecosystems together in ONE
# pull request (multi-ecosystem group), so a week costs a single CI run. Security updates are
# still raised immediately by Dependabot alerts.
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
updates:
  - package-ecosystem: gomod
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: npm
    directory: /web
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      # typescript-eslint 8.71 supports TypeScript < 6.1; remove once a typescript-eslint release
      # supports TypeScript 7 (otherwise every weekly npm update fails on the peer dependency).
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Vitest's mocker needs msw 2 (msw 3 drops StartOptions.onUnhandledRequest); remove once
      # Vitest supports msw 3.
      - dependency-name: msw
        versions: [">=3.0.0"]
      # The types follow the Node LTS line used for the build (Node 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      # The web build stays on the current Node LTS line (Node 24); move up deliberately.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
