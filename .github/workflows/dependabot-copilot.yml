# SPDX-License-Identifier: Apache-2.0
#
# Dependabot follow-up (SPEC §17.4), hourly: THIRD_PARTY_NOTICES.md is regenerated on each open
# Dependabot branch and pushed when it changed (with COPILOT_ASSIGN_TOKEN, so the push starts ci
# again). Green routine Dependabot updates and green Go toolchain security fixes
# (scripts/go-toolchain-fix.sh) are merged into main. Each open Dependabot pull request whose
# ci failed, or whose update is not routine (a changed workflow, Dockerfile or Go release, or a
# major version step), gets one issue (label dependabot-fix) that is assigned to the Copilot
# coding agent; Copilot works on the Dependabot branch and opens a pull request into it. Issues
# of closed Dependabot pull requests are closed. Runs only in the main public repository
# ZeraOrg/opentidemark; elsewhere its job is skipped. Secret COPILOT_ASSIGN_TOKEN: a user token
# that may assign Copilot (fine-grained: this repository with Issues, Pull requests, Contents and
# Actions read and write), because the API does not accept installation tokens.
name: dependabot-copilot

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-copilot
  cancel-in-progress: false # never hand the same pull request off twice

env:
  NODE_VERSION: "24"

jobs:
  notices:
    name: regenerate notices on Dependabot branches
    if: github.repository == 'ZeraOrg/opentidemark'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # A user token: pushes made with GITHUB_TOKEN do not start ci.
          token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: refresh notices
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/dependabot-copilot.sh refresh-notices

  merge:
    name: merge green routine updates
    needs: notices
    if: ${{ !cancelled() && github.repository == 'ZeraOrg/opentidemark' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          # A user token: merges made with GITHUB_TOKEN do not start the push workflows of main.
          COPILOT_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        run: scripts/dependabot-copilot.sh auto-merge

  hand-off:
    name: hand failing Dependabot updates to Copilot
    needs: [notices, merge]
    if: ${{ !cancelled() && github.repository == 'ZeraOrg/opentidemark' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: hand off
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        run: scripts/dependabot-copilot.sh hand-off
