# SPDX-License-Identifier: Apache-2.0
#
# Web UI gate (SPEC §16, §18): lint, format, typecheck, unit tests with coverage, production
# build, CSP check, Playwright e2e + screenshots against the mock-mode preview, npm audit, the
# Go embed of web/dist and the licence notices. Every check step runs even when an earlier one
# failed (`!cancelled()`), so one run reports every problem; the job still fails on any of them.
# Failures and generated files are also published as check-run annotations
# (web/scripts/ci-annotate.mjs) for reviewers who can read the API but not logs or artifacts,
# and pushes on ui/web publish the Playwright screenshots as one orphan commit to the throwaway
# branch ui/screenshots (never main or ui/web) so they can be fetched with git.
name: web

on:
  push:
    branches: ['ui/**', '!ui/screenshots', main]
    paths: ['web/**', '.github/workflows/web.yml', 'internal/web/**', 'Makefile', 'THIRD_PARTY_NOTICES.md']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml', 'internal/web/**', 'Makefile', 'THIRD_PARTY_NOTICES.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  web:
    name: web (lint, test, build, e2e)
    # Long job (Playwright e2e): automatic only in the public repository, where Actions is free;
    # the private repository runs it on demand (workflow_dispatch) and verifies locally with
    # `make web-check` (SPEC §17.4, Actions budget).
    if: github.repository == 'zeraOrg/tidemark' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only for the ui/screenshots publishing step below
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: install
        run: node scripts/ci-annotate.mjs run "npm ci" -- npm ci --no-audit --no-fund
      - name: lint
        if: ${{ !cancelled() }}
        run: node scripts/ci-annotate.mjs run "lint" -- npm run lint
      - name: format
        if: ${{ !cancelled() }}
        run: node scripts/ci-annotate.mjs run "format" -- npm run format:check
      - name: typecheck
        if: ${{ !cancelled() }}
        run: node scripts/ci-annotate.mjs run "typecheck" -- npm run typecheck
      - name: unit tests (coverage)
        if: ${{ !cancelled() }}
        run: node scripts/ci-annotate.mjs run "unit tests" -- npm run test:coverage
      - name: build
        if: ${{ !cancelled() }}
        run: node scripts/ci-annotate.mjs run "build" -- npm run build
      - name: CSP check of the production bundle
        if: ${{ !cancelled() }}
        run: node scripts/ci-annotate.mjs run "CSP check" -- npm run check:csp
      - name: build (mock mode)
        if: ${{ !cancelled() }}
        run: node scripts/ci-annotate.mjs run "build mock" -- npm run build:mock
      - name: install Playwright browser
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium
      - name: e2e + screenshots
        if: ${{ !cancelled() }}
        run: node scripts/ci-annotate.mjs run "e2e" -- npm run e2e
      - name: npm audit
        if: ${{ !cancelled() }}
        run: node scripts/ci-annotate.mjs run "npm audit" -- npm audit --audit-level=high
      - name: upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: web/e2e/screenshots
          if-no-files-found: warn
      - name: publish screenshots to ui/screenshots
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/ui/web' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/shots"
          rm -rf "$out" && mkdir -p "$out"
          if [ -d e2e/screenshots ]; then cp -R e2e/screenshots/. "$out/"; fi
          if [ -d test-results ]; then
            find test-results -name '*.png' | while read -r f; do
              cp "$f" "$out/failure-$(echo "$f" | tr '/' '_')"
            done
          fi
          cd "$out"
          git init -q -b ui/screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "screenshots of ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ui/screenshots
      - name: upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
      - name: upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: web/coverage/coverage-summary.json
          if-no-files-found: ignore
      - name: upload dist
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: web/dist
          if-no-files-found: error

  embed:
    name: go embed of web/dist
    needs: web
    if: ${{ !cancelled() && needs.web.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: internal/web/assets/dist
      - name: go build + web and repository tests
        run: |
          set -o pipefail
          test -f internal/web/assets/dist/index.html
          CGO_ENABLED=0 go build ./...
          go test ./internal/web/... ./internal/repotest/ 2>&1 | tee "$RUNNER_TEMP/go-test.txt" || {
            echo "::error title=go embed tests::$(tail -c 3500 "$RUNNER_TEMP/go-test.txt" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

  notices:
    name: licence notices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: regenerate THIRD_PARTY_NOTICES.md
        run: |
          node web/scripts/ci-annotate.mjs run notices -- make notices
      - name: publish notices
        if: ${{ !cancelled() }}
        run: node web/scripts/ci-annotate.mjs file THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES.md --gzip
      - name: upload notices
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: notices
          path: THIRD_PARTY_NOTICES.md
      - name: notices are up to date
        run: git diff --exit-code THIRD_PARTY_NOTICES.md
