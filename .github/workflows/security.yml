# SPDX-License-Identifier: Apache-2.0
#
# Supply-chain checks (SPEC §15.9, §19.1): govulncheck, npm audit (when web/ exists), the licence
# allow-list for shipped Go code, and a Trivy scan of the container image. Runs on changes and
# weekly for new advisories. Failing steps publish their output through scripts/ci-annotate.sh.
name: security

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOVULNCHECK_VERSION: v1.9.0
  TRIVY_VERSION: v0.75.0

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          scripts/ci-annotate.sh govulncheck -- govulncheck ./...

  licences:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: only allow-listed licences in shipped Go code
        run: scripts/ci-annotate.sh "make licences" -- make licences

  npm-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: detect web/
        id: detect
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
      - name: npm audit
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci --ignore-scripts
          ../scripts/ci-annotate.sh "npm audit" -- npm audit --audit-level=high

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: build image
        run: scripts/ci-annotate.sh "docker build" -- docker build --build-arg VERSION=ci -t tidemark:ci .
      - name: Trivy image scan
        run: |
          scripts/ci-annotate.sh trivy -- docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION#v}" image --exit-code 1 --severity HIGH,CRITICAL \
            --ignore-unfixed --no-progress tidemark:ci
